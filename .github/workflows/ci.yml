name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webhookhub
          POSTGRES_USER: webhookhub
          POSTGRES_PASSWORD: webhookhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webhookhub -d webhookhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEBHOOKHUB_POSTGRES_DSN: postgresql+asyncpg://webhookhub:webhookhub@localhost:5432/webhookhub
      WEBHOOKHUB_TEST_POSTGRES_DSN: postgresql+asyncpg://webhookhub:webhookhub@localhost:5432/webhookhub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --frozen --group dev
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend mypy backend/src backend/tests
      - run: uv run --project backend alembic -c backend/alembic.ini upgrade head
      - run: uv run --project backend alembic -c backend/alembic.ini check
      - run: uv run --project backend pytest backend/tests

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: false
