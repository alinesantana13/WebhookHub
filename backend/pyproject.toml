[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "webhookhub"
version = "0.1.0"
description = "Reliable multi-tenant webhook delivery platform"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "aiokafka>=0.12,<1.0",
  "alembic>=1.19,<2.0",
  "asyncpg>=0.31,<1.0",
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28.1,<1.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pyjwt>=2.10,<3.0",
  "pydantic-settings>=2.14.2,<3.0",
  "redis>=6.4,<7.0",
  "sqlalchemy[asyncio]>=2.0.51,<3.0",
  "uvicorn[standard]>=0.52.1,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<1.0",
  "mypy>=2.3,<3.0",
  "pytest>=9.1.1,<10.0",
  "pytest-asyncio>=1.4,<2.0",
  "pytest-cov>=7.1,<8.0",
  "ruff>=0.16.1,<1.0",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/webhookhub"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=webhookhub --cov-report=term-missing --cov-fail-under=80"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires external infrastructure"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["webhookhub"]
